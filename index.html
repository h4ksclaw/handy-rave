<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANDY RAVE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
canvas { display: block; }

#ui {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 10;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(12px);
  padding: 16px 28px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  min-width: 340px;
}

#ui label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.4);
}

#handy-count {
  font-size: 44px;
  font-weight: bold;
  color: #fff;
  line-height: 1;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}

input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  outline: none;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: #ff0044;
  border-radius: 50%;
  cursor: pointer;
}

input[type=range]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: #ff0044;
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

#transport-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  justify-content: center;
}

#track-info {
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 2px;
  text-transform: uppercase;
  flex: 1;
  text-align: center;
}

.transport-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: rgba(255,255,255,0.6);
  transition: all 0.15s;
  flex-shrink: 0;
}

.transport-btn:hover {
  border-color: rgba(255,255,255,0.4);
  color: #fff;
  background: rgba(255,255,255,0.05);
}

.transport-btn svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

#volume-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

#volume-row svg {
  width: 14px;
  height: 14px;
  fill: rgba(255,255,255,0.35);
  flex-shrink: 0;
}

#title {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.12);
  z-index: 10;
  pointer-events: none;
}

#start-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: pointer;
  transition: opacity 0.5s;
}

#start-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

#start-overlay h1 {
  font-size: 28px;
  letter-spacing: 12px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

#start-overlay p {
  font-size: 12px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<div id="title">HANDY RAVE</div>

<div id="start-overlay">
  <h1>HANDY RAVE</h1>
  <p id="overlay-status">loading dancers...</p>
</div>

<div id="ui">
  <div class="row">
    <div style="text-align:center">
      <div id="handy-count">6</div>
      <label>HANDYCS</label>
    </div>
    <input type="range" id="slider" min="1" max="50" value="6">
  </div>
  <div id="transport-row">
    <button class="transport-btn" id="btn-prev" title="Previous track">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
    </button>
    <div id="track-info">loading...</div>
    <button class="transport-btn" id="btn-next" title="Next track">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg>
    </button>
  </div>
  <div id="volume-row">
    <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zm13.5 7c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <input type="range" id="volume" min="0" max="100" value="70">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </div>
</div>

<audio id="audio"></audio>

<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/DRACOLoader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
