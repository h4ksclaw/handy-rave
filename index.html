<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANDY RAVE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #fff; }
canvas { display: block; }

#ui {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 10;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  padding: 16px 32px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  min-width: 320px;
}

#ui label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
}

#handy-count {
  font-size: 48px;
  font-weight: bold;
  color: #fff;
  line-height: 1;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}

input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  outline: none;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  background: #ff0044;
  border-radius: 50%;
  cursor: pointer;
}

input[type=range]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  background: #ff0044;
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

#track-info {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 2px;
  text-transform: uppercase;
}

#title {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.15);
  z-index: 10;
  pointer-events: none;
}

#start-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: pointer;
  transition: opacity 0.5s;
}

#start-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

#start-overlay h1 {
  font-size: 28px;
  letter-spacing: 12px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

#start-overlay p {
  font-size: 12px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

#volume-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

#volume-row span {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  width: 12px;
  text-align: center;
}
</style>
</head>
<body>

<div id="title">HANDY RAVE</div>

<div id="start-overlay">
  <h1>⚡ HANDY RAVE ⚡</h1>
  <p id="overlay-status">loading dancers...</p>
</div>

<div id="ui">
  <div class="row">
    <div style="text-align:center">
      <div id="handy-count">6</div>
      <label>HANDYCS</label>
    </div>
    <input type="range" id="slider" min="1" max="20" value="6">
  </div>
  <div id="volume-row">
    <span>🔈</span>
    <input type="range" id="volume" min="0" max="100" value="70">
    <span>🔊</span>
  </div>
  <div id="track-info">loading...</div>
</div>

<audio id="audio" loop></audio>

<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script src="js/DRACOLoader.js"></script>
<script src="js/app.js"></script>
</body>
</html>
